[workspace]
resolver = "2"
members = [
    "crates/drift-math",
    "crates/drift-types",
    "crates/drift-data",
    "crates/drift-sim",
    "crates/drift-lua",
    "crates/drift-server",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = { version = "1", features = ["serde"] }
proptest = "1"
approx = "0.5"
