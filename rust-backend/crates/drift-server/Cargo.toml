[package]
name = "drift-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "drift-server"
path = "src/main.rs"

[dependencies]
drift-sim = { path = "../drift-sim" }
drift-lua = { path = "../drift-lua" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync", "io-util", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync", "io-util", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
