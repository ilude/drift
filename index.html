<!DOCTYPE html>
<html lang="en" style="background:#0a0a0f">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift - Sol</title>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="header-bar">
        <span class="system-name" id="system-switcher-btn">Sol System ▾</span>
        <span class="header-sep">|</span>
        <span class="header-clickable" id="view-menu-btn">View ▾</span>
        <span style="flex:1"></span>
        <button type="button" class="header-btn" id="btn-pause">||</button>
        <span class="header-clickable" id="speed-selector-btn">1 Day ▾</span>
        <span id="notif-badge" class="header-btn" style="display:none; color:#cc8844;">0</span>
        <span class="header-sep">|</span>
        <span id="time-display">2038-01-20</span>
        <span id="perf-display" class="hidden"></span>
    </div>

    <div id="notif-dropdown" class="panel hidden" style="position:fixed; z-index:20; max-height:300px; overflow-y:auto; width:280px;"></div>

    <div id="speed-selector-dropdown" class="panel hidden">
        <div class="panel-header">Time Scale</div>
        <div id="speed-list"></div>
    </div>

    <div id="system-switcher-dropdown" class="panel hidden">
        <div class="panel-header">Discovered Systems</div>
        <div id="system-list"></div>
        <div class="panel-header">Discover New</div>
        <div id="discover-controls">
            <input type="text" id="seed-input" placeholder="Enter seed...">
            <div style="display:flex;gap:4px;">
                <button type="button" class="ctrl-btn" id="btn-discover">Discover</button>
                <button type="button" class="ctrl-btn" id="btn-random">Random</button>
            </div>
        </div>
    </div>

    <div id="info-panel" class="panel hidden">
        <div class="panel-header">
            <span id="info-title">Select Body</span>
            <button type="button" id="info-close">[X]</button>
        </div>
        <div id="info-content">
            <div class="info-row"><span class="info-label">Type:</span><span id="info-type">-</span></div>
            <div class="info-row"><span class="info-label">Distance:</span><span id="info-distance">-</span></div>
            <div class="info-row"><span class="info-label">Orbital Period:</span><span id="info-period">-</span></div>
            <div class="info-row"><span class="info-label">Radius:</span><span id="info-radius">-</span></div>
            <div class="info-row"><span class="info-label">Moons:</span><span id="info-moons">-</span></div>
            <div class="info-row"><span class="info-label">Position:</span><span id="info-position">-</span></div>
<div id="info-ship-engine" class="info-row hidden">
                <span class="info-label">Engine:</span><span id="ship-engine-value">-</span>
            </div>
            <div id="info-ship-fuel" class="info-row hidden">
                <span class="info-label">Fuel:</span><span id="ship-fuel-value">-</span>
            </div>
            <div id="info-ship-deltav" class="info-row hidden">
                <span class="info-label">Delta-v:</span><span id="ship-deltav-value">-</span>
            </div>
            <div id="info-transfer" class="info-row hidden">
                <span class="info-label">Transfer:</span>
                <span class="transfer-controls">
                    <select id="transfer-target"></select>
                    <button type="button" id="btn-transfer" class="ctrl-btn">Go</button>
                </span>
            </div>
            <div id="info-transfer-status" class="info-row hidden">
                <span class="info-label"></span><span id="transfer-status-value"></span>
            </div>
            <div id="info-crew-row" class="info-row hidden">
                <span class="info-label">Crew</span>
                <span id="info-crew-value"></span>
            </div>
            <div id="info-morale-row" class="info-row hidden">
                <span class="info-label">Morale</span>
                <span id="info-morale-value"></span>
            </div>
            <div id="info-hull-row" class="info-row hidden">
                <span class="info-label">Hull</span>
                <span id="info-hull-value"></span>
            </div>
            <div id="info-supplies-row" class="info-row hidden">
                <span class="info-label">Supplies</span>
                <span id="info-supplies-value"></span>
            </div>
            <div id="info-action-row" class="info-row hidden">
                <span class="info-label">Action</span>
                <span id="info-action-value"></span>
            </div>
            <div id="info-resources-section" class="hidden">
                <div class="info-row">
                    <span class="info-label" id="info-survey-status"></span>
                </div>
                <div id="info-resources-list"></div>
            </div>
            <div id="command-tree-container" class="hidden"></div>
        </div>
    </div>

    <div id="view-menu-dropdown" class="panel hidden">
        <div class="panel-header">View</div>
        <div class="view-menu-content"></div>
    </div>

    <div id="body-list-panel" class="panel">
        <div class="panel-header">System Bodies</div>
        <div id="body-list"></div>
    </div>

    <div id="status-bar">
        <span style="flex:1"></span>
        <span id="ship-activity" style="color:#6a8a6a; font-size:11px;"></span>
        <span id="zoom-display">Zoom: 1.00x</span>
    </div>

    <script type="module" src="src/main.ts"></script>
</body>
</html>
