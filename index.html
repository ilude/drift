<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift - Sol</title>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="header-bar">
        <span class="system-name" id="system-switcher-btn">Sol System ▾</span>
        <span class="header-sep">|</span>
        <span id="time-display">2038-01-20</span>
        <span class="header-sep">|</span>
        <button class="header-btn" id="btn-pause">||</button>
        <span class="header-clickable" id="speed-selector-btn">1 Day ▾</span>
        <span style="flex:1"></span>
        <span id="fps-display">FPS: --</span>
    </div>

    <div id="speed-selector-dropdown" class="panel hidden">
        <div class="panel-header">Time Scale</div>
        <div id="speed-list"></div>
    </div>

    <div id="system-switcher-dropdown" class="panel hidden">
        <div class="panel-header">Discovered Systems</div>
        <div id="system-list"></div>
        <div class="panel-header">Discover New</div>
        <div id="discover-controls">
            <input type="text" id="seed-input" placeholder="Enter seed...">
            <div style="display:flex;gap:4px;">
                <button class="ctrl-btn" id="btn-discover">Discover</button>
                <button class="ctrl-btn" id="btn-random">Random</button>
            </div>
        </div>
    </div>

    <div id="info-panel" class="panel hidden">
        <div class="panel-header">
            <span id="info-title">Select Body</span>
            <button id="info-close">[X]</button>
        </div>
        <div id="info-content">
            <div class="info-row"><span class="info-label">Type:</span><span id="info-type">-</span></div>
            <div class="info-row"><span class="info-label">Distance:</span><span id="info-distance">-</span></div>
            <div class="info-row"><span class="info-label">Orbital Period:</span><span id="info-period">-</span></div>
            <div class="info-row"><span class="info-label">Radius:</span><span id="info-radius">-</span></div>
            <div class="info-row"><span class="info-label">Moons:</span><span id="info-moons">-</span></div>
            <div class="info-row"><span class="info-label">Position:</span><span id="info-position">-</span></div>
            <div id="info-ship-size" class="info-row hidden">
                <span class="info-label">Size:</span>
                <input type="number" id="ship-size-input" value="0.02" step="0.01" min="0.01" max="1.0">
            </div>
            <div id="info-ship-engine" class="info-row hidden">
                <span class="info-label">Engine:</span><span id="ship-engine-value">-</span>
            </div>
            <div id="info-ship-fuel" class="info-row hidden">
                <span class="info-label">Fuel:</span><span id="ship-fuel-value">-</span>
            </div>
            <div id="info-ship-deltav" class="info-row hidden">
                <span class="info-label">Delta-v:</span><span id="ship-deltav-value">-</span>
            </div>
            <div id="info-transfer" class="info-row hidden">
                <span class="info-label">Transfer:</span>
                <span class="transfer-controls">
                    <select id="transfer-target"></select>
                    <button id="btn-transfer" class="ctrl-btn">Go</button>
                </span>
            </div>
            <div id="info-transfer-status" class="info-row hidden">
                <span class="info-label"></span><span id="transfer-status-value"></span>
            </div>
        </div>
    </div>

    <div id="controls-panel" class="panel">
        <div class="panel-header">Controls</div>
        <div style="padding: 6px 8px;">
            <button class="ctrl-btn" id="btn-recenter" style="width:100%;">Recenter</button>
        </div>
        <div class="panel-header">Display</div>
        <div id="display-controls">
            <label class="ctrl-toggle"><input type="checkbox" id="toggle-orbits" checked> Orbital Rings</label>
            <label class="ctrl-toggle"><input type="checkbox" id="toggle-labels" checked> Labels</label>
            <label class="ctrl-toggle"><input type="checkbox" id="toggle-grid"> Distance Grid</label>
            <label class="ctrl-toggle"><input type="checkbox" id="toggle-trails"> Orbit Trails</label>
        </div>
    </div>

    <div id="body-list-panel" class="panel">
        <div class="panel-header">System Bodies</div>
        <div id="body-list"></div>
    </div>

    <div id="status-bar">
        <span style="flex:1"></span>
        <span id="zoom-display">Zoom: 1.00x</span>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
