services:
  drift:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped

  drift-dev:
    image: oven/bun:1-alpine
    profiles: [dev]
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "bun install && bun run dev --host"
